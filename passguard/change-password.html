<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Change Password — PassGuard</title>
  <link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="assets/logo.svg" alt=""><span>PassGuard</span></div>
    <div class="nav-label">Menu</div>
    <nav class="nav">
      <a href="dashboard.html">⌂ <span>Dashboard</span></a>
      <a class="active" href="change-password.html">🔑 <span>Change Password</span></a>
    </nav>
    <div class="sidebar-footer nav"><button data-logout>↪ <span>Logout</span></button></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="page-title"><h1>Change Password</h1><p>Update your password and reset its expiry period.</p></div>
      <div class="user-pill">
        <div class="avatar" id="avatarText">U</div>
        <div class="user-text"><b id="pillName">User</b><small id="pillUser">@user</small></div>
      </div>
    </div>

    <div class="center-card">
      <div id="expiredNotice" class="notice danger hidden" style="margin-bottom:16px">
        <div class="icon">!</div>
        <div><b>Password expired</b><div style="margin-top:5px">You must change your password before returning to the dashboard.</div></div>
      </div>

      <section class="panel">
        <h3>Create a new password</h3>
        <div id="passwordMessage" class="message hidden"></div>

        <form id="changePasswordForm" class="form-grid">
          <div class="field">
            <label>Current Password</label>
            <div class="password-wrap">
              <input id="currentPassword" type="password" placeholder="Enter current password" required>
              <button class="eye-btn" type="button" onclick="PG.togglePassword(this)">Show</button>
            </div>
          </div>
          <div class="field">
            <label>New Password</label>
            <div class="password-wrap">
              <input id="newPassword" type="password" placeholder="Enter new password" required>
              <button class="eye-btn" type="button" onclick="PG.togglePassword(this)">Show</button>
            </div>
            <div class="password-strength">
              <div class="strength-track"><div class="strength-bar" id="strengthBar"></div></div>
              <div class="strength-label" id="strengthLabel">Use 8+ characters with upper, lower, number and symbol.</div>
            </div>
          </div>
          <div class="field">
            <label>Confirm New Password</label>
            <div class="password-wrap">
              <input id="confirmPassword" type="password" placeholder="Repeat new password" required>
              <button class="eye-btn" type="button" onclick="PG.togglePassword(this)">Show</button>
            </div>
          </div>
          <button class="primary-btn" type="submit">Update Password</button>
        </form>
      </section>
    </div>
  </main>
</div>
<script src="js/utils.js"></script><script src="js/password.js"></script>
</body>
</html>
